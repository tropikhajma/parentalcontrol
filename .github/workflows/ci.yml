name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Verify CycloneDX SBOM
        run: npm run sbom:check

      - name: Retain CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: familycontrol-sbom
          path: sbom/familycontrol.cdx.json

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            tests/check.sh \
            tests/integration.sh \
            tests/zap-baseline.sh \
            luci-app-familycontrol/root/etc/init.d/familycontrol-telemetry \
            luci-app-familycontrol/root/etc/uci-defaults/98-familycontrol-telemetry \
            luci-app-familycontrol/root/etc/uci-defaults/99-familycontrol-http \
            luci-app-familycontrol/root/usr/sbin/familycontrol-otel-export \
            luci-app-familycontrol/root/usr/sbin/familycontrol-otel-loop

      - name: Run OpenWrt checks
        run: ./tests/check.sh
